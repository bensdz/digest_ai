[project]
name = "digest-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "bensdz", email = "faroukbens9@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "accelerate>=1.15.0",
    "bitsandbytes>=0.50.2",
    "datasets>=5.0.1",
    "matplotlib>=3.10.9",
    "mlflow>=3.16.1",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "peft>=0.21.0",
    "pypdf>=6.19.0",
    "python-dotenv>=1.0.0",
    "tokenizers>=0.23.2",
    "torch>=2.14.0",
    "tqdm>=4.70.1",
    "transformers>=5.17.0",
    "trl>=1.13.0",
]

[project.scripts]
digest-ai = "digest_ai:main"

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]
